name: Deploy

on:
  push:
    branches: [main]
    # Docs-only changes skip deploy. Not **/*.md: content/**/*.md are posts,
    # and docs/redirect-map.json is imported by workers/blog-redirect.
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**/*.md'
      - 'docs/pr-media/**'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","lab","public-isolated"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # next build needs Node >= 20.9; the lab host ships Node 18.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
          packageManager: bun
