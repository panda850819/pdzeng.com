name: Deploy

on:
  push:
    branches: [main]
    # Docs-only changes skip deploy. Not **/*.md: content/**/*.md are posts,
    # and docs/redirect-map.json is imported by workers/blog-redirect.
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**/*.md'
      - 'docs/pr-media/**'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
          packageManager: bun
